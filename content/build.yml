derived:
  # Close-ups of the back print. box/hide = [x0, y0, x1, y1] as fractions of the photo.
  tb-print: {from: tb-man-back, box: [0.27, 0.18, 0.67, 0.47]}
  ah-print: {from: ah-man-back, box: [0.28, 0.18, 0.70, 0.47]}
  em-print: {from: em-man-back, box: [0.28, 0.17, 0.72, 0.47]}
  # Quiz versions: design name and spec text blurred so the answer isn't printed on screen
  q1-tb:  {from: tb-man-back,  box: [0.27, 0.18, 0.67, 0.47], hide: [[0.345, 0.198, 0.615, 0.26], [0.522, 0.374, 0.64, 0.466]], mark: "?"}
  q2-ah:  {from: ah-man-back,  box: [0.28, 0.18, 0.70, 0.47], hide: [[0.395, 0.198, 0.63, 0.282], [0.42, 0.376, 0.585, 0.452]], mark: "?"}
  q3-ad:  {from: ad-man-back,  box: [0.28, 0.17, 0.72, 0.47], hide: [[0.40, 0.172, 0.60, 0.246], [0.39, 0.374, 0.61, 0.455]], mark: "?"}
  q4-hob: {from: hob-man-back, box: [0.28, 0.17, 0.72, 0.47], hide: [[0.42, 0.184, 0.585, 0.266], [0.415, 0.381, 0.59, 0.455]], mark: "?"}

reels: []
  # add reels here (see the commented example in git history)

carousels:
  # P1 · Sat 14 Nov · the whole collection in one swipe
  - outdir: media/carousels/engine-study
    cover: {file: 01-cover.jpg, title: "The Engine Study", sub: "8 engines · ₹999 each"}
    slides:
      - {file: 02-twin-boost.jpg,     photo: tb-man-back,  text: "Twin Boost · twin-turbo inline-six"}
      - {file: 03-turbo-forms.jpg,    photo: tf-man-back,  text: "Turbo Forms · turbo inline-six"}
      - {file: 04-heart-of-build.jpg, photo: hob-man-back, text: "Heart of the Build · inline-six"}
      - {file: 05-high-rev.jpg,       photo: hrr-man-back, text: "High-Rev Ritual · V8"}
      - {file: 06-american-heart.jpg, photo: ah-man-back,  text: "American Heart · V8"}
      - {file: 07-engraved.jpg,       photo: em-man-back,  text: "Engraved Motion · V8"}
      - {file: 08-after-dark.jpg,     photo: ad-man-back,  text: "After Dark · flat-six"}
      - {file: 09-mech-bloom.jpg,     photo: mb-man-back,  text: "Mechanical Bloom · the white one"}

  # P2 · Wed 18 Nov · gift guide by car-person type
  - outdir: media/carousels/gift-guide
    cover: {file: 01-cover.jpg, title: "Gift guide for the car person", sub: "Free size exchange till 31 Dec"}
    slides:
      - {file: 02-jdm-fan.jpg,     photo: tb-man-back,    text: "The JDM fan → Twin Boost"}
      - {file: 03-muscle.jpg,      photo: ah-man-back,    text: "The muscle-car dreamer → American Heart"}
      - {file: 04-night-drive.jpg, photo: ad-man-back,    text: "The midnight-drive person → After Dark"}
      - {file: 05-engine-nerd.jpg, photo: mb-man-back,    text: "The engine nerd → Mechanical Bloom"}
      - {file: 06-subtle.jpg,      photo: hob-man-front,  text: "The one who likes it subtle → small front mark"}

flickers:
  # Pause challenge: 8 designs flash past (3 frames each, looping); a 2-frame
  # secret card hides a discount code. Create the code in Shopify before posting.
  - out: media/reels/f01-pause-for-the-code.mp4
    photos: [tb-man-back, tf-man-back, hob-man-back, hrr-man-back, ah-man-back, em-man-back, ad-man-back, mb-man-back]
    hook: "Only 1% can pause\non the code"
    cta: "Hold to pause\nwin 10% off"
    seconds: 12
    frames_per_photo: 3
    secret: {code: "PAUSE10", line: "10% OFF YOUR ORDER", at: 7.3, frames: 2}
    music: assets/music/karvit-boost.m4a

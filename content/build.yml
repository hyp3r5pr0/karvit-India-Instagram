derived:
  # Close-ups of the back print. box/hide = [x0, y0, x1, y1] as fractions of the photo.
  tb-print: {from: tb-man-back, box: [0.27, 0.18, 0.67, 0.47]}
  ah-print: {from: ah-man-back, box: [0.28, 0.18, 0.70, 0.47]}
  em-print: {from: em-man-back, box: [0.28, 0.17, 0.72, 0.47]}
  # Quiz versions: design name and spec text blurred so the answer isn't printed on screen
  q1-tb:  {from: tb-man-back,  box: [0.27, 0.18, 0.67, 0.47], hide: [[0.345, 0.198, 0.615, 0.26], [0.522, 0.374, 0.64, 0.466]], mark: "?"}
  q2-ah:  {from: ah-man-back,  box: [0.28, 0.18, 0.70, 0.47], hide: [[0.395, 0.198, 0.63, 0.282], [0.42, 0.376, 0.585, 0.452]], mark: "?"}
  q3-ad:  {from: ad-man-back,  box: [0.28, 0.17, 0.72, 0.47], hide: [[0.40, 0.172, 0.60, 0.246], [0.39, 0.374, 0.61, 0.455]], mark: "?"}
  q4-hob: {from: hob-man-back, box: [0.28, 0.17, 0.72, 0.47], hide: [[0.42, 0.184, 0.585, 0.266], [0.415, 0.381, 0.59, 0.455]], mark: "?"}

